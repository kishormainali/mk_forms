name: mk_forms
description: A flexible, reactive, and type-safe Flutter form management library powered by flutter_bloc. Handles minimal to complex forms with ease.
version: 1.0.0
homepage: https://github.com/kishormainali/mk_forms
repository: https://github.com/kishormainali/mk_forms
issue_tracker: https://github.com/kishormainali/mk_forms/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  rxdart: ^0.28.0
  meta: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
