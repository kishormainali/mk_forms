name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # v1.0.0-beta.1  (pre-releases)

jobs:
  # ── 1. Verify tests pass before publishing ──────────────────────────────────
  test:
    name: Verify tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  # ── 2. Verify the tag version matches pubspec.yaml ──────────────────────────
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.0.0
          PUBSPEC_VERSION="v$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "Tag:              $TAG"
          echo "pubspec version:  $PUBSPEC_VERSION"
          if [ "$TAG" != "$PUBSPEC_VERSION" ]; then
            echo "❌  Tag ($TAG) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "✅  Versions match"

  # ── 3. Publish using OIDC (no stored credentials) ───────────────────────────
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: validate-version

    # Must match the environment name configured under:
    #   pub.dev package admin → Automated publishing → GitHub Actions
    environment: pub.dev

    permissions:
      id-token: write   # Required for OIDC token exchange with pub.dev
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Publish
        run: dart pub publish --force
